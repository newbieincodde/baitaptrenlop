<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 1 - Floating Action Button</title>
  <style>
    body { font-family: Arial, sans-serif; height: 200vh; padding: 20px; }
    .fab {
      position: fixed; bottom: 30px; right: 30px;
      width: 60px; height: 60px; border-radius: 50%;
      background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer;
      animation: pulse 2s infinite cubic-bezier(0.66, 0, 0, 1);
      box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
    }
    @keyframes pulse {
      to { box-shadow: 0 0 0 20px rgba(37, 99, 235, 0); transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <h2>Nút nổi FAB (Pulse Animation)</h2>
  <button class="fab">Liên hệ</button>
</body>
</html>
