<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoạt động 3 - AOS Scroll Reveal</title>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    .spacer { height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { width: 300px; height: 200px; background: #10b981; margin: 0 auto; color: white; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="spacer"><h2>Cuộn xuống để xem hiệu ứng</h2></div>
  <div class="box" data-aos="fade-up" data-aos-duration="1000">Hiệu ứng AOS Fade-up</div>
  <div class="spacer"></div>
  
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
