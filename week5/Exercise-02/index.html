<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2 - Card Flip Effect</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 50px; background: #e2e8f0; }
    .card-container { width: 300px; height: 400px; perspective: 1000px; }
    .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
    .card-container:hover .card { transform: rotateY(180deg); }
    
    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .card-front { background: #fff; }
    .card-back { background: #1e293b; color: white; transform: rotateY(180deg); gap: 10px; }
    .card-back a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="card">
      <div class="card-front">
        <img src="https://via.placeholder.com/150" alt="Avatar" style="border-radius: 50%; margin-bottom: 15px;">
        <h3>Mặt Trước</h3>
      </div>
      <div class="card-back">
        <h3>Mặt Sau - Thông tin</h3>
        <a href="#">Facebook</a>
        <a href="#">GitHub</a>
      </div>
    </div>
  </div>
</body>
</html>
