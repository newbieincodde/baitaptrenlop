<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 5 - Hamburger Menu</title>
  <style>
    body { background: #333; display: flex; justify-content: center; padding-top: 100px; }
    .menu-btn { width: 40px; height: 30px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
    .bar { width: 100%; height: 4px; background: white; transition: transform 0.3s ease, opacity 0.3s ease; border-radius: 2px; }
    
    /* Trạng thái Open */
    .menu-btn.open .top { transform: translateY(13px) rotate(45deg); }
    .menu-btn.open .mid { opacity: 0; }
    .menu-btn.open .bot { transform: translateY(-13px) rotate(-45deg); }
  </style>
</head>
<body>
  <!-- Click để đổi class (giả lập bằng js nhỏ) -->
  <div class="menu-btn" onclick="this.classList.toggle('open')">
    <span class="bar top"></span>
    <span class="bar mid"></span>
    <span class="bar bot"></span>
  </div>
</body>
</html>
