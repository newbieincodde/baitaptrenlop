<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 4 - Parallax Background</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; text-align: center; }
    .normal-section { height: 100vh; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .parallax-section {
      height: 100vh; display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; font-weight: bold;
      background-image: url('https://images.unsplash.com/photo-1518791841217-8f162f1e1131?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');
      background-attachment: fixed; background-position: center; background-repeat: no-repeat; background-size: cover;
    }
  </style>
</head>
<body>
  <section class="normal-section">Cuộn xuống (Scroll Down)</section>
  <section class="parallax-section">Hiệu ứng Parallax 3D</section>
  <section class="normal-section">Tiếp tục cuộn</section>
</body>
</html>
