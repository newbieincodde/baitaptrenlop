<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 - CSS Grid Masonry Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f8fafc;
    }
    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1e293b;
    }
    /* Grid Masonry Container */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-rows: 180px;
      gap: 15px; /* Đúng chuẩn gap: 15px theo giáo trình */
      max-width: 1100px;
      margin: 0 auto;
    }
    .gallery-item {
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }
    /* Kích thước so le bằng span */
    .item-tall {
      grid-row: span 2;
    }
    .item-wide {
      grid-column: span 2;
    }
    .item-big {
      grid-column: span 2;
      grid-row: span 2;
    }
  </style>
</head>
<body>

  <h2>Thư Viện Ảnh Nghệ Thuật (CSS Grid Masonry)</h2>

  <div class="gallery-container">
    <div class="gallery-item item-big">
      <img src="https://picsum.photos/600/600?random=1" alt="Ảnh 1">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/300/300?random=2" alt="Ảnh 2">
    </div>
    <div class="gallery-item item-tall">
      <img src="https://picsum.photos/300/600?random=3" alt="Ảnh 3">
    </div>
    <div class="gallery-item item-wide">
      <img src="https://picsum.photos/600/300?random=4" alt="Ảnh 4">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/300/300?random=5" alt="Ảnh 5">
    </div>
    <div class="gallery-item item-tall">
      <img src="https://picsum.photos/300/600?random=6" alt="Ảnh 6">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/300/300?random=7" alt="Ảnh 7">
    </div>
    <div class="gallery-item item-wide">
      <img src="https://picsum.photos/600/300?random=8" alt="Ảnh 8">
    </div>
  </div>

</body>
</html>
