<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2 - Adaptive Card Layout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
    .card {
      display: flex;
      flex-direction: column;
      background: white; border-radius: 10px; overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
    }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-content { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    
    @media (min-width: 768px) {
      .card { flex-direction: row; max-width: 700px; }
      .card img { width: 40%; height: auto; }
      .card-content { width: 60%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/300x200" alt="Product">
    <div class="card-content">
      <h3>Sản phẩm đặc biệt</h3>
      <p>Mô tả sản phẩm hiển thị dưới ảnh trên mobile và bên cạnh ảnh trên máy tính.</p>
    </div>
  </div>
</body>
</html>
