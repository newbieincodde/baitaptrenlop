<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 5 - Responsive Image Gallery with CSS Grid</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }
    .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <h2 style="text-align: center; margin-bottom: 20px;">Lưới Ảnh Tự Co Giãn (Auto-fit)</h2>
  <div class="gallery">
    <img src="https://via.placeholder.com/400x300?text=1" alt="1">
    <img src="https://via.placeholder.com/400x300?text=2" alt="2">
    <img src="https://via.placeholder.com/400x300?text=3" alt="3">
    <img src="https://via.placeholder.com/400x300?text=4" alt="4">
  </div>
</body>
</html>
