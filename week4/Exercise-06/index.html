<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 6 - Mobile-First Contact Form</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #e2e8f0; padding: 20px; margin: 0; }
    
    .form-container {
      background: white; padding: 20px; border-radius: 8px;
      width: 100%; /* Mobile first */
      margin: 0 auto;
    }
    .input-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    .input-group label { margin-bottom: 5px; font-weight: bold; }
    .input-group input, .input-group textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; }
    
    /* Desktop */
    @media (min-width: 768px) {
      .form-container { max-width: 500px; padding: 30px; }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2 style="text-align: center; margin-bottom: 20px;">Liên Hệ</h2>
    <div class="input-group">
      <label>Họ tên</label>
      <input type="text" placeholder="Nhập tên">
    </div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="Nhập email">
    </div>
    <button class="btn">Gửi</button>
  </div>
</body>
</html>
