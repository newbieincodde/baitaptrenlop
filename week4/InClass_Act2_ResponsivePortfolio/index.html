<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoạt động 2 - Responsive Portfolio</title>
  <style>
    :root { --gap: 20px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #e2e8f0; padding: 20px; }
    
    /* Mobile First: Mặc định 1 cột */
    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      max-width: 1000px;
      margin: 0 auto;
    }
    .sidebar { background: #1e293b; color: white; padding: 20px; border-radius: 8px; }
    .main-content { background: white; padding: 20px; border-radius: 8px; min-height: 200px; }
    
    /* Desktop: 2 cột */
    @media (min-width: 768px) {
      .container { grid-template-columns: 250px 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Sidebar</h2>
      <p>Nội dung menu chuyển lên đầu trên thiết bị di động.</p>
    </aside>
    <main class="main-content">
      <h2>Nội Dung Chính</h2>
      <p>Sử dụng Media Queries để dàn trang từ 1 cột sang 2 cột khi trên 768px.</p>
    </main>
  </div>
</body>
</html>
